# One-click rollback: point rc-current back at rc-prev (rc-prev was smoked). Catalog rows follow rc-current outside CI.
name: rollback
on:
  workflow_dispatch:
    inputs:
      image: {description: "image dir under images/", required: true}
permissions: {contents: read}
# Registry addresses are CI secrets, not written in this public repository (tools/release.py, tools/harbor.py).
env:
  RC_REGISTRY_PULL: ${{ secrets.RC_REGISTRY_PULL }}
  RC_REGISTRY_PUSH: ${{ secrets.RC_REGISTRY_PUSH }}
jobs:
  rollback:
    runs-on: [self-hosted, radeon-images]
    steps:
      - name: Checkout with long retries (Wuxi egress to github.com drops for minutes; 11-12 11:12-11:18Z, 11:56-12:00Z)
        env: {TOKEN: "${{ github.token }}", BASE: ""}
        run: |
          set -u; cd "$GITHUB_WORKSPACE"; find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          refs=("+${GITHUB_SHA}:refs/remotes/origin/_head"); [ -n "$BASE" ] && refs+=("+refs/heads/${BASE}:refs/remotes/origin/${BASE}")
          for i in $(seq 1 10); do
            if git -c http.extraHeader="$auth" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch -q --no-tags --depth=100 origin "${refs[@]}"; then
              git checkout -q --detach "$GITHUB_SHA" && echo "checked out ${GITHUB_SHA::8} (attempt $i)" && exit 0
            fi
            echo "fetch attempt $i failed; retrying in 60 s"; sleep 60
          done
          echo "::error::could not reach github.com after 10 attempts"; exit 1
      - run: |
          umask 077; mkdir -p "$RUNNER_TEMP/docker"
          kubectl -n amd-oneclick-ci-runners get secret radeon-images-harbor -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > "$RUNNER_TEMP/docker/config.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          python3 - "${{ inputs.image }}" <<'PY'
          import sys; sys.path.insert(0, "tools")
          import harbor, release
          m = release.parse(sys.argv[1]); prev = harbor.artifact(m["rc_repo"], "rc-prev")
          if not prev: raise SystemExit("no rc-prev to roll back to")
          cur = harbor.artifact(m["rc_repo"], "rc-current")
          harbor.tag(m["rc_repo"], prev["digest"], "rc-current")
          if cur: harbor.tag(m["rc_repo"], cur["digest"], "rc-rolled-back")
          print("ROLLED BACK", m["rc_repo"], "->", prev["digest"])
          PY
