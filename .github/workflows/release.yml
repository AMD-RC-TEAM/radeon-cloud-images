# Merging a change under images/<name>/ to main IS the release gate (owner D-20261112-27).
# Per changed image: mirror upstream (digest-preserving) -> 1-GPU W7900D smoke on the CI node -> move rc-current.
# The catalog rows that track rc-current are updated outside CI (D-20261112-33).
name: release
on:
  push:
    branches: [main]
    paths: ["images/**", "tools/keep_image_env.*"]   # the shared SSH step is part of every image (release.py)
  workflow_dispatch:
    inputs:
      image: {description: "image dir under images/", required: true}
concurrency: {group: "release-${{ github.ref }}", cancel-in-progress: false}
permissions: {contents: read, issues: write, actions: read}
# release.py's reaper asks GitHub whether the run that owns a leftover Job has finished (needs actions: read).
# Registry addresses are CI secrets, not written in this public repository (tools/release.py, tools/harbor.py).
env:
  GH_TOKEN: ${{ github.token }}
  RC_REGISTRY_PULL: ${{ secrets.RC_REGISTRY_PULL }}
  RC_REGISTRY_PUSH: ${{ secrets.RC_REGISTRY_PUSH }}
jobs:
  plan:
    runs-on: [self-hosted, radeon-images]
    outputs: {images: "${{ steps.p.outputs.images }}"}
    steps:
      - name: Checkout with long retries (Wuxi egress to github.com drops for minutes; 11-12 11:12-11:18Z, 11:56-12:00Z)
        env: {TOKEN: "${{ github.token }}", BASE: ""}
        run: |
          set -u; cd "$GITHUB_WORKSPACE"; find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          refs=("+${GITHUB_SHA}:refs/remotes/origin/_head"); [ -n "$BASE" ] && refs+=("+refs/heads/${BASE}:refs/remotes/origin/${BASE}")
          for i in $(seq 1 10); do
            if git -c http.extraHeader="$auth" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch -q --no-tags --depth=100 origin "${refs[@]}"; then
              git checkout -q --detach "$GITHUB_SHA" && echo "checked out ${GITHUB_SHA::8} (attempt $i)" && exit 0
            fi
            echo "fetch attempt $i failed; retrying in 60 s"; sleep 60
          done
          echo "::error::could not reach github.com after 10 attempts"; exit 1
      - id: p
        run: |
          if [ -n "${{ inputs.image }}" ]; then echo 'images=["${{ inputs.image }}"]' >> "$GITHUB_OUTPUT"; exit 0; fi
          # tools/changed_images.py: comment-only image.yaml edits don't re-release an image; a change to the shared
          # SSH-environment step (tools/keep_image_env.*: the script and its Dockerfile lines) changes every image.
          python3 tools/changed_images.py HEAD~1 HEAD >> "$GITHUB_OUTPUT"
  release:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' }}
    runs-on: [self-hosted, radeon-images]
    strategy: {fail-fast: false, max-parallel: 1, matrix: {image: "${{ fromJSON(needs.plan.outputs.images) }}"}}
    steps:
      - name: Checkout with long retries (Wuxi egress to github.com drops for minutes; 11-12 11:12-11:18Z, 11:56-12:00Z)
        env: {TOKEN: "${{ github.token }}", BASE: ""}
        run: |
          set -u; cd "$GITHUB_WORKSPACE"; find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          refs=("+${GITHUB_SHA}:refs/remotes/origin/_head"); [ -n "$BASE" ] && refs+=("+refs/heads/${BASE}:refs/remotes/origin/${BASE}")
          for i in $(seq 1 10); do
            if git -c http.extraHeader="$auth" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch -q --no-tags --depth=100 origin "${refs[@]}"; then
              git checkout -q --detach "$GITHUB_SHA" && echo "checked out ${GITHUB_SHA::8} (attempt $i)" && exit 0
            fi
            echo "fetch attempt $i failed; retrying in 60 s"; sleep 60
          done
          echo "::error::could not reach github.com after 10 attempts"; exit 1
      - name: Credentials from the runner namespace (never echoed)
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/docker"
          kubectl -n amd-oneclick-ci-runners get secret radeon-images-harbor -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - name: Release
        run: python3 tools/release.py "${{ matrix.image }}"
      - name: Report failure to the daily issue
        if: failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          t="Image pipeline daily $(date -u +%F)"; n=$(gh issue list -S "\"$t\" in:title" --json number -q '.[0].number')
          [ -n "$n" ] || n=$(gh issue create -t "$t" -b "One issue per day. A failed release does not move rc-current." | grep -oE '[0-9]+$')
          gh issue comment "$n" -b "${{ matrix.image }}: release failed, rc-current not moved: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
