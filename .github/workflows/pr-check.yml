# Required checks for merging to main (D-20261112-29): `validate` always, `smoke` for every changed image.
# Merging is the release; these checks make sure only images that pass the W7900D smoke can be merged.
name: pr-check
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  validate:
    runs-on: [self-hosted, radeon-images]
    outputs: {images: "${{ steps.c.outputs.images }}"}
    steps:
      - name: Checkout with long retries (Wuxi egress to github.com drops for minutes; 11-12 11:12-11:18Z, 11:56-12:00Z)
        env: {TOKEN: "${{ github.token }}", BASE: "${{ github.base_ref }}"}
        run: |
          set -u; cd "$GITHUB_WORKSPACE"; find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          refs=("+${GITHUB_SHA}:refs/remotes/origin/_head"); [ -n "$BASE" ] && refs+=("+refs/heads/${BASE}:refs/remotes/origin/${BASE}")
          for i in $(seq 1 10); do
            if git -c http.extraHeader="$auth" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch -q --no-tags --depth=100 origin "${refs[@]}"; then
              git checkout -q --detach "$GITHUB_SHA" && echo "checked out ${GITHUB_SHA::8} (attempt $i)" && exit 0
            fi
            echo "fetch attempt $i failed; retrying in 60 s"; sleep 60
          done
          echo "::error::could not reach github.com after 10 attempts"; exit 1
      - name: Parse every image and workflow
        run: |
          for d in images/*/; do python3 tools/release.py "$(basename "$d")" --dry-run >/dev/null; test -x "$d/smoke.sh"; done
          python3 -c 'import glob,yaml;[yaml.safe_load(open(f)) for f in glob.glob(".github/workflows/*.yml")]'
          python3 -m py_compile tools/*.py
          python3 -I tools/test_catalog_sync.py
      - id: c
        name: Changed images
        run: |
          # Same rule as release: a change to the shared SSH-environment step (tools/keep_image_env.sh) changes every image.
          { git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- images/ | cut -d/ -f2
            git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- tools/keep_image_env.sh || ls images; } | sort -u \
            | python3 -c 'import json,sys;print("images="+json.dumps([l.strip() for l in sys.stdin if l.strip()]))' >> "$GITHUB_OUTPUT"
  smoke:
    needs: validate
    runs-on: [self-hosted, radeon-images]
    steps:
      - name: Checkout with long retries (Wuxi egress to github.com drops for minutes; 11-12 11:12-11:18Z, 11:56-12:00Z)
        env: {TOKEN: "${{ github.token }}", BASE: ""}
        run: |
          set -u; cd "$GITHUB_WORKSPACE"; find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          refs=("+${GITHUB_SHA}:refs/remotes/origin/_head"); [ -n "$BASE" ] && refs+=("+refs/heads/${BASE}:refs/remotes/origin/${BASE}")
          for i in $(seq 1 10); do
            if git -c http.extraHeader="$auth" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch -q --no-tags --depth=100 origin "${refs[@]}"; then
              git checkout -q --detach "$GITHUB_SHA" && echo "checked out ${GITHUB_SHA::8} (attempt $i)" && exit 0
            fi
            echo "fetch attempt $i failed; retrying in 60 s"; sleep 60
          done
          echo "::error::could not reach github.com after 10 attempts"; exit 1
      - name: Smoke changed images (none changed = pass)
        run: |
          imgs='${{ needs.validate.outputs.images }}'
          [ "$imgs" = "[]" ] && { echo "no image changed"; exit 0; }
          umask 077; mkdir -p "$RUNNER_TEMP/docker"
          kubectl -n amd-oneclick-ci-runners get secret radeon-images-harbor -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > "$RUNNER_TEMP/docker/config.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          for i in $(echo "$imgs" | python3 -c 'import json,sys;print(" ".join(json.load(sys.stdin)))'); do
            python3 tools/release.py "$i" --smoke-only
          done
