# Release settings for this image (read by tools/release.py and tools/upstream_check.py).
name: pytorch-latest
rc_repo: rc/pytorch-latest               # Harbor: 10.5.10.12:1808/radeon-cloud-global/rc/pytorch-latest:rc-current is what the catalog stable row tracks
catalog_row: "PyTorch · 最新"           # the stable catalog row only; template rows are never touched
smoke: pytorch                 # which smoke profile images/pytorch-latest/smoke.sh runs (see README)
upstream:
  registry: docker.io
  repo: rocm/pytorch
  tag_regex: '^rocm1[0-9]\.[0-9]+\.[0-9]+_ubuntu24\.04_py3\.12_pytorch_release_2\.[0-9]+\.[0-9]+$'         # the upgrade bot proposes the newest tag matching this
