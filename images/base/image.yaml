# Release settings for this image (read by tools/release.py and tools/upstream_check.py).
name: base
rc_repo: rc/base               # the catalog stable row tracks <registry>/rc/base:rc-current
catalog_row: "Base"           # the stable catalog row only; template rows are never touched
smoke: base                 # images/base/smoke.sh
upstream:            # the registry/repo come from the Dockerfile's FROM line
  tag_regex: '^rocm7\.2\.[0-9]+_ubuntu24\.04_py3\.12_pytorch_release_2\.10\.[0-9]+$'   # stay on the ROCm 7.2 / PyTorch 2.10 line
