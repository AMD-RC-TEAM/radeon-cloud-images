# Release settings for this image (read by tools/release.py and tools/upstream_check.py).
name: ollama
rc_repo: rc/ollama               # the catalog stable row tracks <registry>/rc/ollama:rc-current
catalog_row: "Ollama"            # the stable catalog row only; template rows are never touched
smoke: ollama                 # which smoke profile images/ollama/smoke.sh runs
upstream:            # the registry/repo come from the Dockerfile's FROM line
  tag_regex: '^rocm7\.2\.[0-9]+_ubuntu24\.04_py3\.12_pytorch_release_2\.10\.[0-9]+$'   # stay on the ROCm 7.2 / PyTorch 2.10 line, like Base; Ollama itself is pinned in the Dockerfile
